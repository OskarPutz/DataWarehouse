services:
  rentmaster:
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: rentmaster
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./generator:/generator
      # data warehouse: sample data for BULK INSERT and the SQL scripts (implementation folder)
      - ./implementation/bulk:/dw_data/bulk
      - ./implementation/scripts:/dw_data/scripts

  cube:
    image: cubejs/cube:latest
    container_name: cube
    ports:
      - "4000:4000"
    environment:
      - CUBEJS_DEV_MODE=true
      - CUBEJS_DB_TYPE=mssql
      # service name of SQL Server in this file
      - CUBEJS_DB_HOST=rentmaster
      - CUBEJS_DB_PORT=1433
      - CUBEJS_DB_NAME=SigmaPolDW
      - CUBEJS_DB_USER=sa
      # must be the same as MSSQL_SA_PASSWORD in db/Dockerfile
      - CUBEJS_DB_PASS=RentMaster_Dev1!
      - CUBEJS_DB_SSL=false
      - CUBEJS_API_SECRET=sigmapol_secret
      - CUBEJS_SCHEMA_PATH=model
    volumes:
      - ./implementation/cube/schema:/cube/conf/model
    depends_on:
      - rentmaster

volumes:
  mssql_data:
